<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Живой дневник — эмулятор</title>
<style>
@font-face{font-family:Hand;src:url('/fonts/caveat')}*{box-sizing:border-box}body{margin:0;background:#ece9e1;color:#25251f;font:16px system-ui}main{max-width:840px;margin:24px auto;padding:0 16px}h1{font:38px Hand,cursive;margin-bottom:8px}p{line-height:1.5}label{display:block;margin:12px 0}input{padding:10px;border:1px solid #aaa;border-radius:4px;width:100%;font:inherit}button{padding:10px 15px;background:white;border:1px solid #888;border-radius:4px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5d653e}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.paper{position:relative;margin:16px 0;background:#fff;box-shadow:0 3px 24px #0002}canvas{display:block;width:100%;height:auto;touch-action:none}#answer{padding:36px;font:30px/1.5 Hand,cursive;white-space:pre-wrap;overflow-wrap:anywhere}.sources{font:16px/1.6 system-ui}#status{min-height:24px}#history button{display:block;width:100%;text-align:left;margin:6px 0}summary{cursor:pointer}small{color:#5b5b50}
</style>
<main>
<h1>Живой дневник</h1>
<p>Напишите вопрос мышью или пером. Через пять секунд паузы дневник ответит. Очередь сохраняется в этом браузере, даже если сеть пропадёт.</p>
<details open id="connection"><summary>Подключение</summary><label>Ключ доступа к дневнику <input id="token" type="password" autocomplete="off"></label><button id="connect">Подключить</button><p><small>В деморежиме LLM не вызывается. Для живого ответа серверу нужен ключ OpenRouter.</small></p></details>
<p id="status" role="status" aria-live="polite">Ожидает подключения</p>
<div class="toolbar"><button id="new">Новая страница</button><button id="send">Отправить сейчас</button><button id="erase">Ластик: выкл.</button><button id="conversation">Новый диалог</button></div>
<div class="paper"><canvas id="page" width="1404" height="1872" aria-label="Страница для рукописного вопроса"></canvas><div id="answer" hidden></div></div>
<details><summary>История</summary><div id="history"></div></details>
</main>
<script>
const canvas=document.querySelector('#page'),ctx=canvas.getContext('2d'),answer=document.querySelector('#answer'),status=document.querySelector('#status');
let token='',down=false,eraser=false,strokes=[],stroke=[],timer=null,dirty=false,active=null,view='writing',busy=false,animation=0;
let conversation=localStorage.getItem('remarkabl-conversation')||crypto.randomUUID();localStorage.setItem('remarkabl-conversation',conversation);
const dbReady=new Promise((resolve,reject)=>{const req=indexedDB.open('remarkabl-diary',1);req.onupgradeneeded=()=>req.result.createObjectStore('turns',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function put(turn){const db=await dbReady;await new Promise((resolve,reject)=>{const t=db.transaction('turns','readwrite');t.objectStore('turns').put(turn);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function all(){const db=await dbReady;return new Promise((resolve,reject)=>{const r=db.transaction('turns').objectStore('turns').getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>a.created-b.created));r.onerror=()=>reject(r.error)})}
function blank(){animation++;clearTimeout(timer);ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);canvas.hidden=false;answer.hidden=true;answer.textContent='';strokes=[];stroke=[];dirty=false;active=null;view='writing';status.textContent='Напишите вопрос'}
function point(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height,eraser?18:3]}
canvas.onpointerdown=e=>{if(view!=='writing')return;e.preventDefault();canvas.setPointerCapture(e.pointerId);clearTimeout(timer);down=true;stroke=[];const p=point(e);stroke.push(p);ctx.fillStyle=eraser?'white':'black';ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();dirty=true};
canvas.onpointermove=e=>{if(!down)return;const p=point(e),prev=stroke.at(-1);ctx.strokeStyle=eraser?'white':'black';ctx.lineWidth=p[2]*2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();stroke.push(p)};
function penUp(){if(!down)return;down=false;strokes.push(stroke);if(dirty)timer=setTimeout(commit,5000)}canvas.onpointerup=penUp;canvas.onpointercancel=penUp;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...options.headers}});if(!response.ok){const error=await response.json().catch(()=>({}));throw new Error(error.detail||('Ошибка '+response.status))}return response.json()}
async function commit(){if(down)return false;if(view!=='writing'||!dirty)return true;clearTimeout(timer);const turn={id:crypto.randomUUID(),conversation_id:conversation,image_base64:canvas.toDataURL('image/png').split(',')[1],strokes,created:Date.now(),local_status:'queued'};try{await put(turn)}catch(e){status.textContent='Не удалось сохранить страницу; текст остаётся на экране';return false}active=turn.id;view='waiting';dirty=false;status.textContent='Вопрос сохранён. Ожидаю ответ…';canvas.style.opacity='.45';await sync();canvas.style.opacity='1';return true}
async function show(turn,animate=false){view='answer';active=turn.id;canvas.hidden=true;answer.hidden=false;answer.textContent='';const text=turn.result.answer||turn.result.error||'Ожидает ответа';const mine=++animation;if(animate){for(const chunk of text.match(/.{1,3}/gs)||[]){if(mine!==animation)return;answer.append(document.createTextNode(chunk));await new Promise(resolve=>setTimeout(resolve,12))}}else answer.textContent=text;if(mine!==animation)return;const refs=document.createElement('div');refs.className='sources';for(const ref of turn.result.citations||[]){const p=document.createElement('p');p.textContent=`[${ref.number}] ${ref.title} — ${ref.location}`;refs.append(p)}answer.append(refs);status.textContent=turn.result.status==='error'?'Вопрос сохранён, но ответ не получен':'Ответ сохранён в истории'}
async function renderHistory(){const turns=await all();const root=document.querySelector('#history');root.textContent='';for(const turn of turns.reverse()){const button=document.createElement('button');button.textContent=turn.result?.transcription||new Date(turn.created).toLocaleString();button.onclick=()=>{if(turn.result)show(turn)};root.append(button)}}
async function sync(){if(busy||!token)return;busy=true;try{for(const turn of await all()){if(turn.local_status==='complete')continue;const result=turn.local_status==='queued'?await api('/v1/turns',{method:'POST',body:JSON.stringify(turn)}):await api('/v1/turns/'+turn.id);turn.local_status=(result.status==='complete'||result.status==='error')?'complete':'submitted';turn.result=result;await put(turn);if(active===turn.id&&view==='waiting'&&turn.local_status==='complete')await show(turn,true)}}catch(e){status.textContent=navigator.onLine?e.message:'Нет сети. Вопрос сохранён до подключения.'}finally{busy=false;await renderHistory()}}
document.querySelector('#connect').onclick=async()=>{token=document.querySelector('#token').value.trim();try{const s=await api('/v1/status');status.textContent=s.mock_llm?'Подключено: деморежим без вызова LLM':'Подключено';document.querySelector('#connection').open=false;await sync()}catch(e){status.textContent=e.message}};
document.querySelector('#new').onclick=()=>{if(dirty){commit().then(saved=>{if(saved)blank()})}else blank()};document.querySelector('#send').onclick=commit;document.querySelector('#erase').onclick=()=>{eraser=!eraser;document.querySelector('#erase').textContent='Ластик: '+(eraser?'вкл.':'выкл.')};document.querySelector('#conversation').onclick=()=>{if(dirty){status.textContent='Сначала отправьте текущую страницу';return}conversation=crypto.randomUUID();localStorage.setItem('remarkabl-conversation',conversation);blank()};
window.addEventListener('online',sync);setInterval(sync,2000);blank();renderHistory();
</script></html>
