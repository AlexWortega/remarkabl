[project]
name = "remarkabl"
version = "0.1.0"
description = "A self-hosted handwritten diary and reading library for reMarkable 1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1", "httpcore>=1.0,<2", "pydantic-settings>=2.7,<3",
  "pillow>=11,<13", "pymupdf>=1.25,<2", "ebooklib>=0.19,<1",
  "beautifulsoup4>=4.13,<5", "trafilatura>=2,<3", "reportlab>=4.3,<5",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6", "torch>=2.5,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
native = ["ziglang==0.13.0"]

[project.scripts]
remarkabl = "remarkabl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
