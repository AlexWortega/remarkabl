[package]
name = "remarkabl-diary"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
png = "0.17"
ab_glyph = "0.2"
rustybuzz = "0.20"
unicode-segmentation = "1.13"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[features]
default = ["rm2"]
rm2 = []

[profile.release]
strip = true
lto = true
